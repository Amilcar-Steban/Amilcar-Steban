<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#0d3b2a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .w1{animation:s 9s ease-in-out infinite alternate}
    .w2{animation:s 12s ease-in-out infinite alternate-reverse}
    @keyframes s{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    .cur{animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>
  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#grid)"/>
  <g opacity="0.35" class="w2"><path d="M0 200 Q150 170 300 200 T600 200 T900 200 T1200 200 T1500 200 V240 H0Z" fill="url(#wave)"/></g>
  <g opacity="0.6" class="w1"><path d="M0 215 Q150 195 300 215 T600 215 T900 215 T1200 215 T1500 215 V240 H0Z" fill="url(#wave)"/></g>
  <text x="600" y="62" text-anchor="middle" class="m" font-size="16" fill="#7ee787">$ kubectl get engineer amilcar-rodriguez</text>
  <text x="600" y="122" text-anchor="middle" class="t" font-size="52" font-weight="700">Amilcar Rodriguez</text>
  <text x="600" y="162" text-anchor="middle" class="t m" font-size="20" fill="#c9d1d9">DevOps &amp; Software Engineer<tspan class="cur" fill="#2ea043"> ▌</tspan></text>
</svg>
