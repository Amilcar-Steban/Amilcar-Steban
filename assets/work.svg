    <text x="634" y="120" class="s" font-size="17" font-weight="700" fill="#e6edf3">You build it, you run it</text><text x="634" y="148" class="s" font-size="14" fill="#c9d1d9">Observability and alerts are</text><text x="634" y="169" class="s" font-size="14" fill="#c9d1d9">part of done.</text><text x="862" y="192" text-anchor="end" class="m" font-size="12" fill="#3fb950">✓ passed</text><circle cx="1038" cy="56" r="15" fill="#000" stroke="#3fb950" stroke-width="2"/>
